name: Jobfolio checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobfolio-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  OPENAI_API_KEY: ''
  TRACKER_REVIEW_MODE: disabled
  NEXT_PUBLIC_ENABLE_BASELINE: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Isolated backend tests (network calls blocked)
        working-directory: backend
        run: python -B -m unittest discover -s tests -v
      - name: Evaluation contracts and fixtures (no models)
        run: |
          python -B -m unittest discover -s evaluation -v
          python -B evaluation/validate_cases.py
          python -B evaluation/harness.py score --split development --output "$RUNNER_TEMP/jobfolio-evaluation.json"

  frontend-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # This address is intercepted by the browser suite, never used as a real backend.
      NEXT_PUBLIC_TRACKER_API_URL: http://127.0.0.1:43128
      TRACKER_PREVIEW_API: http://127.0.0.1:43128
      TRACKER_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - name: CSV and filename regressions
        run: node --test scripts/export-check.test.mjs
      - name: Generate route types and check TypeScript
        working-directory: frontend
        run: |
          npx --no-install next typegen
          npm run typecheck
      - run: npm run build
        working-directory: frontend
      - name: Isolated production-browser suite
        env:
          TRACKER_ARTIFACTS_PARENT: ${{ runner.temp }}/jobfolio-browser
        run: node scripts/ci-browser.mjs
      - name: Synthetic screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jobfolio-browser-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/jobfolio-browser/**/results.json
            ${{ runner.temp }}/jobfolio-browser/**/*.png
            ${{ runner.temp }}/jobfolio-browser/**/frontend.log
